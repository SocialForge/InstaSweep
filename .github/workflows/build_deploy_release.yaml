name: Build deploy release
on:
    push:
    workflow_dispatch:

concurrency:
    group: 'pages-${{ github.ref }}'
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
            contents: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - uses: actions/checkout@v6

            # BUILD
            - name: Use node
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Build
              run: npm run build

            - name: Compress public directory
              run: zip -r InstaSweep.zip public/

            - name: Get release metadata
              id: release_metadata
              run: |
                  datetime=$(date '+%Y.%m.%d_%H%M')
                  version=$(node -p 'require("./package.json").version')
                  echo "datetime=$datetime" >> "$GITHUB_OUTPUT"
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v5.0.0
              with:
                  path: './public'

            # DEPLOY
            - name: Setup Pages
              uses: actions/configure-pages@v6.0.0

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5.0.1

            # RELEASE
            - name: Create Release
              uses: softprops/action-gh-release@v3.0.3
              with:
                  files: InstaSweep.zip
                  tag_name: v${{ steps.release_metadata.outputs.version }}-${{ steps.release_metadata.outputs.datetime }}
                  name: InstaSweep v${{ steps.release_metadata.outputs.version }} (${{ steps.release_metadata.outputs.datetime }})
                  generate_release_notes: true
                  draft: false
                  prerelease: false
